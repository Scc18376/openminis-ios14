name: Build iOS 14.3 IPA

on:
  workflow_dispatch:
    inputs:
      skip_deps:
        description: "跳过 native deps 编译（用缓存）"
        type: boolean
        default: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Verify iOS 14.3 port
        run: |
          grep -o "IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*" src/ios/Minis.xcodeproj/project.pbxproj | sort -u
          ls src/ios/Compat/
          grep -c "CompatCore.swift" src/ios/Minis.xcodeproj/project.pbxproj

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Select Xcode
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          ls /Applications | grep -i xcode

      - name: Cache native frameworks
        uses: actions/cache@v4
        with:
          path: |
            deps/frameworks
            deps/resources
          key: minis-deps-${{ hashFiles('deps/build_*.sh') }}

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache-dependency-path: deps/rclone-mobile/go.sum

      - name: Install build tools
        run: |
          brew install pkg-config ninja llvm lld libarchive nasm || true
          echo "/opt/homebrew/opt/llvm/bin" >> $GITHUB_PATH
          echo "/opt/homebrew/opt/lld/bin" >> $GITHUB_PATH
          pip3 install --break-system-packages meson || pip3 install meson || true
          echo "--- versions ---"
          ninja --version || true
          go version || true

      - name: Build native deps
        if: ${{ !inputs.skip_deps }}
        run: |
          set -e
          cd deps
          ls frameworks 2>/dev/null || true
          ./build_lame.sh
          ./build_ffmpeg.sh
          ./build_rclone_ios.sh
          ./build_ish.sh
          echo "--- frameworks ---"
          ls -d frameworks/*.xcframework 2>/dev/null || true
        env:
          BUILDCONFIGURATION: Release

      - name: Prepare alpine rootfs
        run: |
          cd deps
          if [ -f resources/alpine-rootfs.zip ]; then
            echo "rootfs cached"
          else
            ./prepare_alpine_rootfs.sh
          fi
          ls -la resources/ | head -10

      - name: Save frameworks cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            deps/frameworks
            deps/resources
          key: minis-deps-${{ hashFiles('deps/build_*.sh') }}

      - name: Provider config
        run: |
          cp src/ios/Configs/ProviderCustomization.xcconfig.example src/ios/Configs/ProviderCustomization.xcconfig || true

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project src/ios/Minis.xcodeproj \
            -scheme Minis \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_BITCODE=NO \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS=arm64 \
            build 2>&1 | tee build.log | tail -250

      - name: Package unsigned IPA
        if: success()
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          echo "APP=$APP"
          mkdir -p Payload
          cp -a "$APP" Payload/
          python3 scripts/lower_minos.py Payload 14.3
          brew install ldid || true
          find Payload -type f -exec sh -c 'file "$1" | grep -q Mach-O && ldid -S "$1"' _ {} \; || true
          zip -qry Minis-iOS14.3-unsigned.ipa Payload
          ls -lh Minis-iOS14.3-unsigned.ipa

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Minis-iOS14.3-unsigned
          path: Minis-iOS14.3-unsigned.ipa

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn
